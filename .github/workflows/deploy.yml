name: Deploy

# КАРКАС. Конкретного сервера пока нет — здесь только форма пайплайна:
# ручной запуск, выбор окружения и проверка секретов.
#
# Чтобы включить деплой:
#   1. Settings → Environments → создать staging / production,
#      добавить required reviewers (это и есть ручное подтверждение).
#   2. Добавить секреты окружения: GCP_PROJECT_ID, GCP_REGION,
#      GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT,
#      и переменную VITE_API_BASE_URL с адресом бэкенда.
#   3. Раскомментировать блок «Cloud Run» ниже и убрать шаг-заглушку.
#
# VITE_API_BASE_URL вшивается в бандл на этапе сборки, поэтому образ
# нельзя переносить между окружениями — под каждое собирается свой.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Окружение
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write # OIDC вместо долгоживущих ключей

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      SERVICE_NAME: mentorhub-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Check target is configured
        run: |
          missing=()
          [ -n "$GCP_PROJECT_ID" ] || missing+=(GCP_PROJECT_ID)
          [ -n "$GCP_REGION" ] || missing+=(GCP_REGION)
          [ -n "$VITE_API_BASE_URL" ] || missing+=(VITE_API_BASE_URL)

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Деплой ещё не настроен. Не заданы: ${missing[*]}"
            echo "См. комментарий в начале .github/workflows/deploy.yml"
            exit 1
          fi

      - name: Placeholder
        run: |
          echo "Секреты на месте, но шаги деплоя ещё закомментированы."
          echo "Раскомментируйте блок Cloud Run в .github/workflows/deploy.yml."
          exit 1

